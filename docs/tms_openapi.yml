openapi: 3.1.0
info:
  title: TMS portal server
  description: TMS portal server documentation
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Development
  - url: https://tms-auth-service.tacc.cloud
    description: Development Server

paths:
  "/login":
    post:
      tags:
        - Login
      summary: Login
      description: |
        Log in to the TMS Portal through an approved institution (from /institutions), and
        redirect back to redirect_uri (which must be configured as an allowed redirect uri).
        Globus is given the institution's redirect_idp_domain (so a user not yet signed in
        goes straight to the institution's login page), session_required_single_domain (so
        Globus requires an identity from its domain) and prompt=login.  A login that can't
        start (no institution, an unusable one, a redirect uri that isn't allowed, no Globus
        login provider) goes back to the sign in page with ?error=<code> instead.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TmsLoginRequest'
      responses:
        "307":
          description: Redirect to the Globus authorize url.  Sets the state_cookie.
          headers:
            location:
              schema:
                type: string
              description: Globus authorize url
        "303":
          description: The login can't start; redirect to the sign in page with ?error=<code>
          headers:
            location:
              schema:
                type: string
              description: "sign in page (base url) with ?error=<code>: institution_required, unapproved_institution, stale_authentication, login_cancelled, login_expired, login_failed or login_unavailable"
    get:
      tags:
        - Login
      summary: Login
      description: |
        Log in to the TMS Portal through an approved institution (from /institutions), and
        redirect back to redirect_uri (which must be configured as an allowed redirect uri).
        Globus is given the institution's redirect_idp_domain (so a user not yet signed in
        goes straight to the institution's login page), session_required_single_domain (so
        Globus requires an identity from its domain) and prompt=login.  A login that can't
        start (no institution, an unusable one, a redirect uri that isn't allowed, no Globus
        login provider) goes back to the sign in page with ?error=<code> instead.
      parameters:
        - name: redirect_uri
          schema:
            type: string
          in: query
          required: false
        - name: client_return_uri
          schema:
            type: string
          in: query
          required: false
        - name: client_name
          schema:
            type: string
          in: query
          required: false
        - name: institution
          description: The id of an approved institution from /institutions.  Without one the login goes back to the sign in page with ?error=institution_required.
          schema:
            type: string
          in: query
          required: true
      responses:
        "307":
          description: Redirect to the Globus authorize url.  Sets the state_cookie.
          headers:
            location:
              schema:
                type: string
              description: Globus authorize url
        "303":
          description: The login can't start; redirect to the sign in page with ?error=<code>
          headers:
            location:
              schema:
                type: string
              description: "sign in page (base url) with ?error=<code>: institution_required, unapproved_institution, stale_authentication, login_cancelled, login_expired, login_failed or login_unavailable"
  "/logout":
    post:
      tags:
        - Login
      summary: Logout
      description: |
        Log out of the TMS Portal.  The token is taken from the Authorization: Bearer header
        or the tmstoken cookie; a missing, revoked or invalid token still logs out.  The
        token is revoked, the tmstoken cookie removed, and the browser sent to Globus's
        sign-out page, which links on to /logout/idp when the token's institution has its own
        IdP sign-out page (otherwise back to the sign in page).  Only POST is accepted, so
        another site can't log a user out with a link.
      responses:
        "303":
          description: Redirect to Globus's sign-out page (or the sign in page without a valid token)
          headers:
            location:
              schema:
                type: string
              description: https://auth.globus.org/v2/web/logout?client_id=...&redirect_uri=...&redirect_name=...

  "/logout/idp":
    get:
      tags:
        - Login
      summary: Logout of the institution's IdP
      description: |
        The second step of logging out of an institution: Globus's sign-out page links here,
        and this redirects to the institution's own IdP sign-out page (idp_logout_url from the
        institutions list), so its session ends too.  An unknown institution, or one without
        an IdP sign-out page, goes to the sign in page.  Only urls from the institutions list
        are used, so this isn't an open redirect.
      parameters:
        - name: institution
          description: The institution id (from the TMS token's tms/institution claim)
          required: true
          schema:
            type: string
          in: query
      responses:
        "303":
          description: Redirect to the institution's IdP sign-out page, or the sign in page
          headers:
            location:
              schema:
                type: string
              description: idp_logout_url, or the sign in page

  "/login/whoami":
    get:
      tags:
        - Login
      summary: whoami
      security:
        - Bearer: [ ]
      description: Get information about logged in user
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmsWhoAmIResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmsErrorResponse'

  "/login/idps":
    get:
      tags:
        - Login
      summary: listIdps
      description: Get list of all supported login identity providers
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLoginIdpResponse'

  "/login/callback":
    get:
      tags:
        - Login
      summary: callback
      description: |
        Called by the identity provider (Globus) with a code that can be exchanged for a
        token, or with an error (RFC 6749 4.1.2.1).  The state must match the state_cookie
        and still be valid.  The id token's nonce must be this login's; its identity must be
        from the institution's domain (preferred_username, or an identity in identity_set) and
        must have authenticated after the login started.  The state_cookie is always removed.
      parameters:
        - name: code
          schema:
            type: string
          in: query
          required: false
        - name: state
          in: query
          schema:
            type: string
          required: false
        - name: error
          description: Sent by the identity provider instead of a code, e.g. access_denied when the user cancels
          in: query
          schema:
            type: string
          required: false
        - name: error_description
          in: query
          schema:
            type: string
          required: false
      responses:
        "307":
          description: Logged in.  Sets the tmstoken cookie (the TMS JWT) and redirects to the login's redirect uri.
          headers:
            location:
              schema:
                type: string
              description: the redirect_uri given to /login
        "303":
          description: The login was refused, cancelled, failed or expired; redirect to the sign in page with ?error=<code>
          headers:
            location:
              schema:
                type: string
              description: "sign in page (base url) with ?error=<code>: institution_required, unapproved_institution, stale_authentication, login_cancelled, login_expired, login_failed or login_unavailable"

  "/resources/{provider_id}/{provider_account_id}":
    get:
      tags:
        - Resource
      summary: listResources
      description: Get a list of the resources for a given provider
      security:
        - Bearer: [ ]
      parameters:
        - name: provider_id
          in: path
          required: true
          description: The id of the provider to list resource for
          schema:
            type: string
        - name: provider_account_id
          in: path
          required: true
          description: The account id of the user for this provider
          schema:
            type: string

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResourcesResponse'

  "/resources/providers":
    get:
      tags:
        - Resource
      summary: listResourceProviders
      description: Get a list of the resource providers
      security:
        - Bearer: [ ]
      parameters:
        - name: linked_only
          description: If set to true, only previously linked providers will be returned
          schema:
            type: boolean
            default: false
          in: query
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items: 
                  $ref: '#/components/schemas/ResourceProvider'

  "/resources/providers/links":
    get:
      tags:
        - Resource
      summary: getLinkedResourceAccounts
      description: Get a list of the resource providers that have been linked to the current tms account
      security:
        - Bearer: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items: 
                  $ref: '#/components/schemas/ResourceAccountLink'

  "/resources/providers/links/{resource_provider_link_id}":
    delete:
      tags:
        - Resource
      summary: unlinkResourceAccount
      description: Unlink a resource provider account from the current tms account
      security:
        - Bearer: [ ]
      parameters:
        - name: resource_provider_link_id
          description: The id of the resource provider link (as returned by getLinks)
          required: true
          schema:
            type: string
          in: path

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAccountLogin'

  "/resources/providers/authorize":
    get:
      tags:
        - Resource
      summary: authorizeWithResourceProvider
      description: Authorization for a resource provider
      security:
        - Bearer: [ ]
      parameters:
        - name: provider_id
          schema:
            type: string
          in: query
          required: true
        - name: redirect_url
          schema:
            type: string
          in: query
          required: true
        - name: state
          schema:
            type: string
          in: query
          required: false
      responses:
        "307":
          description: Temporary redirect
          headers:
            location:
              schema:
                type: string
              description: redirect url
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmsErrorResponse'

  "/oauth2/authorize":
    get:
      tags:
        - OAuth2
      summary: authorize
      description: |
        Authorize endpoint for oauth2.  The client and redirect uri are checked first, and an
        error there is returned, never redirected to.  Every login goes through an approved
        institution: without one, the browser is sent to the TMS Portal's sign in page with
        the request, which shows the institution picker and sends the request back with
        &institution=<id>.  An unusable institution goes back to the client's redirect uri
        with an RFC 6749 error.  Otherwise the browser goes to Globus, like a portal /login.
      parameters:
        - name: response_type
          description: Response type expected from authorize - currently only "code is" supported
          required: true
          schema:
            type: string
          in: query
        - name: client_id
          description: client id for authorization
          required: true
          schema:
            type: string
          in: query
        - name: redirect_uri
          description: Redirect uri for oauth callback
          required: true
          schema:
            type: string
          in: query
        - name: scope
          description: scopes - currently this is ignored (but it will be used in the future)
          required: false
          schema:
            type: string
          in: query
        - name: state
          description: App supplied state variable.  This will be sent to the callback url unchanged.
          required: false
          schema:
            type: string
          in: query
        - name: institution
          description: The id of an approved institution from /institutions.  Without one the browser goes to the sign in page's institution picker.
          required: false
          schema:
            type: string
          in: query
      responses:
        "307":
          description: Redirect to the Globus authorize url.  Sets the state_cookie.
          headers:
            location:
              schema:
                type: string
              description: Globus authorize url
        "303":
          description: |
            Without an institution, redirect to the sign in page carrying the request
            (response_type, client_id, redirect_uri, state, scope).  With an unusable
            institution, or no Globus login provider, redirect to the client's redirect_uri
            with error, error_description and state.
          headers:
            location:
              schema:
                type: string
              description: the sign in page, or the client's redirect_uri with an error
        "400":
          description: The client or redirect uri isn't allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmsErrorResponse'

  "/oauth2/callback":
    get:
      tags:
        - OAuth2
      summary: callback
      description: |
        Called by Globus for another client's login, with a code or an error (RFC 6749
        4.1.2.1).  The same checks as /login/callback apply.  The state_cookie is always
        removed.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: |
            Logged in: redirect to the client's redirect_uri with code (for /oauth2/tokens)
            and state.  Refused, cancelled or failed: redirect to the client's redirect_uri
            with error (invalid_request, access_denied, server_error or
            temporarily_unavailable), error_description and state.  When the state can't be
            trusted, redirect to the sign in page with ?error=<code>.
          headers:
            location:
              schema:
                type: string
              description: the client's redirect_uri, or the sign in page


  "/oauth2/tokens":
    post:
      tags:
      - OAuth2
      summary: tokens
      description: OAuth2 tokens endpoint.  At present only the grant_type code is supported.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmsErrorResponse'

  "/delegations/":
    get:
      tags:
        - Delegations
      summary: listDelegations
      security:
        - Bearer: [ ]
      description: Get a list of delegations for the tms user for all clients.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationListResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmsErrorResponse'
    post:
      tags:
        - Delegations
      summary: addDelegation
      security:
        - Bearer: [ ]
      description: Add delegation for resource from a resource provider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationRequest'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmsErrorResponse'

  "/delegations/{client_name}":
    get:
      tags:
        - Delegations
      summary: listDelegations
      security:
        - Bearer: [ ]
      description: Get a list of delegations for the tms user.  Client name may be supplied to limit the list to delegations
                   for a particular client.
      parameters:
        - name: client_name
          schema:
            type: string
          in: path
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationListResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmsErrorResponse'

  "/delegations/{client_name}/{delegation_id}":
    delete:
      tags:
        - Delegations
      summary: deleteDelegation
      security:
        - Bearer: [ ]
      description: Deletes a delegation for resources from a resource provider
      parameters:
        - name: client_name
          in: path
          required: true
          description: The name of the client for the delegation to delete
          schema:
            type: string
        - name: delegation_id
          in: path
          required: true
          description: The id of the delegation to delete
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmsErrorResponse'
# ------------------------------------------------------------------------------
# --- Components ---------------------------------------------------------------
# ------------------------------------------------------------------------------
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # ------------------------------------------------------------------------------
    # --- Model objects ------------------------------------------------------------
    # ------------------------------------------------------------------------------
    TmsErrorResponse:
      type: object
      properties:
        status:
          type: string
        result:
          type: string

    TmsWhoAmIResponse:
      type: object
      properties:
        status:
          type: string
        result:
          properties:
            name:
              type: string
            user_name:
              type: string
            idpDisplayName:
              type: string
            organization:
              type: string
    
    
    TmsLoginRequest:
      required:
        - redirect_uri
        - institution
      type: object
      properties:
        redirect_uri:
          type: string
        client_return_uri:
          type: string
        client_name:
          type: string
        institution:
          description: The id of an approved institution from /institutions
          type: string

    ListLoginIdpResponse:
      type: object
      properties:
        status:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/IdentityProvider'

    ListResourcesResponse:
      type: object
      properties:
        status:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/Resource'

    IdentityProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        clientId:
          type: string
        oauth2TokenUrl:
          type: string
        userInfoUrl:
          type: string
        created:
          type: string
        updated:
          type: string

    ResourceProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        clientId:
          type: string
        oauth2TokenUrl:
          type: string
        userInfoUrl:
          type: string
        created:
          type: string
        updated:
          type: string

    ResourceAccountLink:
      type: object
      properties:
        tms_identity:
          type: string
        id:
          type: number
        resource_provider_id:
          type: string
        resource_provider_name:
          type: string
        resource_provider_uuid:
          type: string
        resource_provider_account:
          type: string
        last_login:
          type: string
        enabled:
          type: boolean

    ResourceAccountLogin:
      type: object
      properties:
        tms_identity:
          type: string
        id:
          type: number
        resource_provider_uuid:
          type: string
        resource_provider_account:
          type: string
        last_login:
          type: string
        enabled:
          type: boolean


    Resource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        provider_id:
          type: string
        provider_name:
          type: string

    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          $ref: '#/components/schemas/AccessToken'

    AccessToken:
      type: object
      properties:
        access_token:
          type: string
        expires_at:
          type: string
        expires_in:
          type: integer
          format: int64
        id_token:
          type: string
        jti:
          type: string

    OAuthTokenRequest:
      required:
        - client_id
        - client_secret
        - grant_type
        - redirect_uri
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        grant_type:
          type: string
          enum:
            - authorization_code
        redirect_uri:
          type: string
        code:
          type: string
        refresh_token:
          type: string

    DelegationRequest:
      properties:
        client_name:
          type: string
        resource_provider_id:
          type: string
        resource_provider_account:
          type: string

    DelegationResponse:
      type: object
      properties:
        access_token:
          $ref: '#/components/schemas/Delegation'

    DelegationListResponse:
      type: object
      properties:
        status:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/Delegation'

    Delegation:
      properties:
        id:
          type: integer
          format: int32
        client_id:
          type: string
        client_name:
          type: string
        rp_account:
          type: string
        expires_at:
          type: string
        created:
          type: string
        updated:
          type: string
        tms_identity:
          type: string
        rp_id:
          type: string

