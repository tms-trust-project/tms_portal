name: TMS Portal CI

on:
  push:
    branches: [ dev, staging, master ]
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches: [ dev, staging, master ]

jobs:
  resolve-image-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - id: resolve
        name: Set_image
        shell: bash
        run: |
          image_tag="$GITHUB_REF_NAME"

          echo "${image_tag}"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$image_tag" == v* ]]; then
            image_tag="${image_tag#v}"
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  # tests:
  #   runs-on: ubuntu-latest
  #   needs:
  #     - resolve-image-tag
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Setup Rust
  #       uses: dtolnay/rust-toolchain@stable
  #     - name: Run Tests
  #       run: cargo test -p services/tms_portal

  build-push-tms-portal-api-image:
    runs-on: ubuntu-latest
    needs:
      # - tests
      - resolve-image-tag
    steps:
    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.CIC_DOCKERHUB_USERNAME }}
        password: ${{ secrets.CIC_DOCKERHUB_ACCESS_TOKEN }}
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build Image
      run: docker buildx build --platform linux/x86_64 --no-cache --progress=plain -f services/tms_portal/Dockerfile -t ${{ inputs.image_name }}:${{ inputs.image_tag }} --build-arg SERVICE_NAME=tms_portal .
    - name: Push Image
      run: docker push --all-tags ${{ inputs.image_name }}
