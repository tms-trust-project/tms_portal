name: Client CI

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        # the pnpm version comes from packageManager in client/package.json
        with:
          runtime: node@24
          package-json-file: client/package.json
          cache: true
          cache-dependency-path: client/pnpm-lock.yaml
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm exec prettier --check '**/*.{ts,tsx}'
      - name: build
        # the build requires a redirect uri (vite.config.ts); this one only checks the build
        env:
          REDIRECT_URI: https://tms-portal.savanna.tacc.cloud/
        run: pnpm run build
      - name: Test
        run: pnpm test run --coverage
