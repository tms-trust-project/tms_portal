name: TMS API

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      redirect_uri:
        description: The portal URL the login returns to, compiled into the web client
        required: true
        type: string

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test -p tms-api

  build-push-api-image:
    needs:
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.CIC_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CIC_DOCKERHUB_ACCESS_TOKEN }}
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Image
        env:
          REDIRECT_URI: ${{ inputs.redirect_uri }}
        run: docker buildx build --platform linux/x86_64 --no-cache --progress=plain -f services/tms-api/Dockerfile -t ${{ inputs.image_name }}:${{ inputs.image_tag }} --build-arg SERVICE_NAME=tms-api --build-arg REDIRECT_URI="$REDIRECT_URI" .
      - name: Push Image
        run: docker push --all-tags ${{ inputs.image_name }}
