name: TMS Core CI

on:
  push:
    branches: [ dev, staging, main ]
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches: [ dev, staging, main ]

jobs:
  resolve-image-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - id: resolve
        name: Set_image
        shell: bash
        run: |
          image_tag="$GITHUB_REF_NAME"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$image_tag" == v* ]]; then
            image_tag="${image_tag#v}"
          fi

          # Replaces "/" in the ref name with "-""
          image_tag=$(echo $image_tag | sed -e "s|/|-|g")

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  tms-api:
    needs:
      - resolve-image-tag
    secrets: inherit
    uses: ./.github/workflows/tms-api.yml
    with:
      image_name: tapis/tms-api
      image_tag: ${{ needs.resolve-image-tag.outputs.image_tag }}
      # a repository (or environment) variable, e.g. https://tms-portal.savanna.tacc.cloud/
      redirect_uri: ${{ vars.TMS_PORTAL_REDIRECT_URI }}
      
  tms-ui:
      uses: ./.github/workflows/client-ci.yml
