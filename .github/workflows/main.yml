name: TMS Portal CI

on:
  push:
    branches: [ dev, staging, master ]
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches: [ dev, staging, master ]

jobs:
  resolve-image-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - id: resolve
        name: Set_image
        shell: bash
        run: |
          image_tag="$GITHUB_REF_NAME"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$image_tag" == v* ]]; then
            image_tag="${image_tag#v}"
          fi

          # Replaces / in the ref name with -
          image_tag=$(echo $image_tag | sed -e "s|/|-|g")

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  # tests:
  #   runs-on: ubuntu-latest
  #   needs:
  #     - resolve-image-tag
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Setup Rust
  #       uses: dtolnay/rust-toolchain@stable
  #     - name: Run Tests
  #       run: cargo test -p services/tms_portal

  tms-portal:
    needs:
      - resolve-image-tag
    #   - tests
    secrets: inherit
    uses: ./.github/workflows/tms-portal-ci.yml
    with:
      image_name: tapis/mlhub-agents-api
      image_tag: ${{ needs.resolve_image_tag.outputs.image_tag }}
